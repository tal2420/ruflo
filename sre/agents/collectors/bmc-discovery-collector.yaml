# BMC Discovery / ADDM collector agent
type: bmc-discovery-collector
version: "0.1.0"
layer: "1-discovery"
description: "Pulls the BMC Discovery (ADDM) software/hardware/BAI model — a strong prior for static dependency topology."
capabilities:
  - software-inventory
  - hardware-inventory
  - dependency-model-ingestion
  - business-application-mapping
tools:
  allowed:
    - mcp__bmc-discovery__query
    - mcp__bmc-discovery__list_hosts
    - mcp__bmc-discovery__list_software_instances
    - mcp__bmc-discovery__list_business_application_instances
    - mcp__bmc-discovery__get_dependency_model
    - kg__upsert_entity
    - kg__upsert_edge
  denied:
    - mcp__bmc-discovery__*_write
blast_radius: read
environments:
  - prod
  - stage
schedule:
  incremental: "0 */4 * * *"
  full: "0 4 * * 0"
prompt: ./bmc-discovery-collector.md
